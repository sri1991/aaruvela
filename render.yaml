services:
  # Backend Service
  - type: web
    name: aaruvela-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    rootDir: backend
    branch: main
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: ENVIRONMENT
        value: production
      - key: API_HOST
        value: 0.0.0.0
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CORS_ORIGINS
        sync: false # Set to frontend URL after deployment
      - key: CRON_SECRET
        generateValue: true # Render generates it; the cron below reads the same value

  # Daily video cleanup — deletes expired (7 day) and rejected videos plus their
  # storage objects. Without this the bucket keeps growing even though expired
  # videos are already hidden from members.
  - type: cron
    name: aaruvela-video-cleanup
    runtime: docker
    schedule: "0 20 * * *" # 01:30 IST daily
    dockerfilePath: ./Dockerfile.cron
    rootDir: backend
    branch: main
    envVars:
      - key: API_URL
        fromService:
          type: web
          name: aaruvela-api
          property: url
      - key: CRON_SECRET
        fromService:
          type: web
          name: aaruvela-api
          envVarKey: CRON_SECRET # Linked, so the two can never drift apart

staticSites:
  # Frontend Service
  - name: aaruvela-web
    buildCommand: npm install && npm run build
    publishDir: dist
    rootDir: .
    branch: main
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: aaruvela-api
          property: url
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: aaruvela-api
          property: url
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
